name: native-control-ci

on:
  push:
    branches:
      - feat/linux-shared-runtime
  pull_request:

jobs:
  compile-native-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Compile native host client
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror             -c src/native_client.cpp -o native_client.o
